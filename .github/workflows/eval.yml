name: Eval Harness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Prism.PythonService
    env:
      # Dummy values to satisfy pydantic BaseSettings validation at import time.
      # CI runs fixture-only eval — no real services are hit, so these
      # placeholders are safe. Real secrets belong in Azure Key Vault at deploy time.
      PRISM_DB_HOST: "localhost"
      PRISM_DB_DATABASENAME: "test"
      PRISM_DB_USERNAME: "test"
      PRISM_DB_PASSWORD: "test"
      ConnectionStrings__messaging: "amqp://test:test@localhost:5672/"
      ConnectionStrings__blobs: "DefaultEndpointsProtocol=http;AccountName=test;AccountKey=test;BlobEndpoint=http://localhost:9000;"
      AI_API_KEY: "dummy-key-not-used-in-fixture-eval"
      GROQ_API_KEY: "dummy-key-not-used-in-fixture-eval"
      LLM_EXTRACTION_MODEL: "gemini-3.6-flash"
      LLM_EXTRACTION_FALLBACK_MODEL: "gemini-3.1-flash-lite"
      LLM_CLAIM_AUDIT_MODEL: "gemini-3.6-flash"
      LLM_CLAIM_AUDIT_FALLBACK_MODEL: "gemini-3.1-flash-lite"
      LLM_GROUNDING_MODEL: "groq/openai/gpt-oss-20b"
      LLM_GROUNDING_FALLBACK_MODEL: "gemini/gemini-3.1-flash-lite"
      LLM_CHAT_MODEL: "gemini-3.6-flash"
      LLM_ROUTER_MODEL: "gemini-3.5-flash-lite"
      LLM_SUMMARY_MODEL: "gemini-3.5-flash-lite"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run offline eval tests
        run: uv run pytest eval/tests/ -v
      - name: Check fixture freshness
        run: uv run python -m eval.check_fixture_freshness
      - name: Run matrix eval (fixture mode)
        run: uv run python -m eval.matrix_runner --source fixture
      - name: Check matcher-relevant paths changed
        id: matcher_paths
        if: github.event_name == 'push'
        working-directory: ${{ github.workspace }}
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" -- \
              Prism.PythonService/eval/matcher.py \
              docs/evals/matcher_gold.json \
              | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Matcher gold-set (integration)
        # Real Gemini calls against docs/evals/matcher_gold.json, calibrating
        # the LLM-as-judge matcher itself - separate from the frozen-fixture
        # scoring above (see docs/decisions.md "Freeze matcher output into
        # fixtures"), which stays fixture-only. Runs only on push to main
        # (not on every PR, and never for fork PRs, which don't see repo
        # secrets) when the matcher or its gold set actually changed, so it
        # doesn't burn Gemini quota on unrelated pushes or fail forks on a
        # missing secret - see docs/decisions.md for the scoped reversal.
        # The pytest command itself is unchanged from a manual on-demand run:
        #   uv run pytest eval/tests/test_matcher.py -v -m integration
        if: >-
          github.event_name == 'push' &&
          secrets.AI_API_KEY != '' &&
          steps.matcher_paths.outputs.changed == 'true'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: uv run pytest eval/tests/test_matcher.py -v -m integration