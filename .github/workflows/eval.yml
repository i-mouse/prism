name: Eval Harness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Prism.PythonService
    env:
      # Dummy values to satisfy pydantic BaseSettings validation at import time.
      # CI runs fixture-only eval — no real services are hit, so these
      # placeholders are safe. Real secrets belong in Azure Key Vault at deploy time.
      PRISM_DB_HOST: "localhost"
      PRISM_DB_DATABASENAME: "test"
      PRISM_DB_USERNAME: "test"
      PRISM_DB_PASSWORD: "test"
      ConnectionStrings__messaging: "amqp://test:test@localhost:5672/"
      ConnectionStrings__blobs: "DefaultEndpointsProtocol=http;AccountName=test;AccountKey=test;BlobEndpoint=http://localhost:9000;"
      AI_API_KEY: "dummy-key-not-used-in-fixture-eval"
      GROQ_API_KEY: "dummy-key-not-used-in-fixture-eval"
      LLM_EXTRACTION_MODEL: "gemini-3.6-flash"
      LLM_EXTRACTION_FALLBACK_MODEL: "gemini-3.1-flash-lite"
      LLM_CLAIM_AUDIT_MODEL: "gemini-3.6-flash"
      LLM_CLAIM_AUDIT_FALLBACK_MODEL: "gemini-3.1-flash-lite"
      LLM_GROUNDING_MODEL: "groq/openai/gpt-oss-20b"
      LLM_GROUNDING_FALLBACK_MODEL: "gemini/gemini-3.1-flash-lite"
      LLM_CHAT_MODEL: "gemini-3.6-flash"
      LLM_ROUTER_MODEL: "gemini-3.5-flash-lite"
      LLM_SUMMARY_MODEL: "gemini-3.5-flash-lite"
      # Not a placeholder like the values above - these two must match
      # whatever LLM_EVAL_MATCHER_MODEL/LLM_EVAL_MATCHER_FALLBACK_MODEL were
      # set to locally when `eval.verify_matcher_gold` last froze
      # matcher_fingerprint into docs/evals/fixtures/*.json. check_fixture_freshness
      # recomputes the fingerprint from these env vars and compares it
      # byte-for-byte against the committed value - a mismatch here fails CI
      # even though no matcher behavior actually changed. Update both
      # together with the fixtures whenever the matcher model routing changes.
      LLM_EVAL_MATCHER_MODEL: "gemini-3.6-flash"
      LLM_EVAL_MATCHER_FALLBACK_MODEL: "gemini-3.1-flash-lite"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run offline eval tests
        run: uv run pytest eval/tests/ -v
      - name: Check fixture freshness
        run: uv run python -m eval.check_fixture_freshness
      - name: Run matrix eval (fixture mode)
        run: uv run python -m eval.matrix_runner --source fixture