server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API requests to the backend Container App
  location /api/ {
    proxy_pass https://apiservice.nicesky-c6f0b846.centralindia.azurecontainerapps.io;
    proxy_http_version 1.1;
    proxy_set_header Host apiservice.nicesky-c6f0b846.centralindia.azurecontainerapps.io;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
    proxy_read_timeout 300s;
    proxy_connect_timeout 30s;
  }

  # Proxy SignalR WebSocket connections to the backend
  location /hubs/ {
    proxy_pass https://apiservice.nicesky-c6f0b846.centralindia.azurecontainerapps.io;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host apiservice.nicesky-c6f0b846.centralindia.azurecontainerapps.io;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # SPA fallback: serve index.html for any non-file route
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Health probe
  location /health {
    access_log off;
    return 200 "healthy\n";
  }
}